asyncapi: 3.0.0

info:
  title: Workers API Events
  version: 0.1.0
  description: |
    Уведомления об изменениях данных. Документ описывает сервер.

    Подключение: `ws://localhost:8080/api/v1/events`; вне локальной разработки — `wss`.
    До HTTP Upgrade сервер проверяет `Origin` по списку разрешённых адресов фронтенда.
    Отсутствующий или запрещённый `Origin` отклоняется HTTP-ответом 403.
    Параметры URL не поддерживаются; при их наличии сервер возвращает HTTP 400.

    Аутентификация выполняется при HTTP Upgrade той же серверной сессией, что и в REST:
    браузер передаёт cookie `JSESSIONID` после `POST /api/v1/auth/login`.
    Без действующего входа сервер отклоняет Upgrade HTTP-ответом 401, соединение не открывается.
    Идентификатор сессии и другие секреты не передаются в URL и в сообщениях.
    CSRF-токен для подключения не нужен: соединение не изменяет данные.

    После открытия соединения сервер сначала отправляет `AUTHENTICATED`, затем разрешает уведомления.
    После фиксации транзакции, изменившей работников, организации, адреса, координаты,
    локации или персон, сервер отправляет `DATA_CHANGED` всем соединениям вошедших пользователей,
    включая инициатора изменения. Это относится и к найму, и к индексации зарплат.
    Одна транзакция даёт одно уведомление, даже если изменила несколько объектов.
    Откат транзакции и операции без изменений не создают уведомлений.

    Событие не содержит изменённых данных: оно сообщает, что состояние нужно заново прочитать через REST.
    Получив `AUTHENTICATED`, клиент загружает актуальное состояние через REST.
    По `DATA_CHANGED` клиент перечитывает открытые списки, карточки и результаты специальных операций.
    Если уведомление пришло во время REST-запроса, перечитывание повторяется после его завершения.
    История событий не хранится и не воспроизводится: события, пропущенные без соединения,
    не доставляются повторно, после переподключения данные загружаются заново через REST.
    Клиент может объединять несколько уведомлений в одно перечитывание.

    Соединение действует, пока действует вход сессии. При выходе, истечении тайм-аута бездействия,
    повторном входе в той же сессии или перезапуске сервера сервер по возможности отправляет
    `ERROR` с кодом `SESSION_ENDED` и закрывает соединение кодом 4001.
    После этого клиент выполняет вход через REST и подключается заново.
    При выходе клиент сам закрывает соединение кодом 1000 и прекращает переподключения.
    При временном обрыве клиент повторяет подключение с увеличивающейся задержкой до 30 секунд;
    ответ 401 на Upgrade требует повторного входа, без бесконечных повторов.

    Клиент не отправляет прикладных сообщений. Служебные WebSocket Ping/Pong не являются
    прикладными сообщениями. Сообщения сервера — текстовый JSON.
    Перед закрытием сервер по возможности отправляет `ERROR`; получение ошибки не гарантируется при обрыве связи.

    Коды закрытия:
    - 4001 — вход сессии завершён.
    - 4002 — клиент отправил текстовое прикладное сообщение.
    - 1003 — бинарное сообщение.
    Коды 4001 и 4002 — прикладные коды WebSocket, а не HTTP-статусы.

defaultContentType: application/json

servers:
  local:
    host: localhost:8080
    protocol: ws
    description: Локальный сервер.

channels:
  events:
    address: /api/v1/events
    title: Обновления данных.
    description: Один канал для подтверждения подключения и уведомлений.
    servers:
      - $ref: '#/servers/local'
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
        headers:
          type: object
          required: [Origin, Cookie]
          properties:
            Origin:
              type: string
              format: uri
              description: Разрешённый адрес фронтенда, проверяется до подключения.
            Cookie:
              type: string
              description: Cookie `JSESSIONID` сессии с выполненным входом; браузер передаёт её сам.
        query:
          type: object
          additionalProperties: false
    messages:
      authenticated:
        $ref: '#/components/messages/Authenticated'
      data_changed:
        $ref: '#/components/messages/DataChanged'
      error:
        $ref: '#/components/messages/Error'

operations:
  send_messages:
    action: send
    title: Отправить сообщение клиенту.
    summary: Подтверждение подключения, уведомление или ошибка.
    channel:
      $ref: '#/channels/events'
    messages:
      - $ref: '#/channels/events/messages/authenticated'
      - $ref: '#/channels/events/messages/data_changed'
      - $ref: '#/channels/events/messages/error'

components:
  messages:
    Authenticated:
      name: Authenticated
      title: Соединение аутентифицировано.
      summary: Первое сообщение сервера; после него клиент загружает данные через REST.
      payload:
        $ref: '#/components/schemas/Authenticated'
      examples:
        - name: authenticated
          summary: Подтвердить подключение.
          payload:
            type: AUTHENTICATED

    DataChanged:
      name: DataChanged
      title: Данные изменились.
      summary: Клиент перечитывает открытые данные через REST.
      payload:
        $ref: '#/components/schemas/DataChanged'
      examples:
        - name: data_changed
          summary: Сообщить об изменении.
          payload:
            type: DATA_CHANGED

    Error:
      name: Error
      title: Ошибка соединения.
      summary: После ошибки сервер закрывает соединение.
      payload:
        $ref: '#/components/schemas/Error'
      examples:
        - name: session_ended
          summary: Вход сессии завершён.
          payload:
            type: ERROR
            code: SESSION_ENDED
            description: The session has ended. Log in again and reconnect.
        - name: invalid_message
          summary: Неподдерживаемое сообщение.
          payload:
            type: ERROR
            code: INVALID_MESSAGE
            description: Client messages are not supported.

  schemas:
    Authenticated:
      title: Подтверждение аутентификации.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [AUTHENTICATED]

    DataChanged:
      title: Уведомление об изменениях.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [DATA_CHANGED]

    Error:
      title: Данные ошибки.
      type: object
      additionalProperties: false
      required: [type, code, description]
      properties:
        type:
          type: string
          enum: [ERROR]
        code:
          type: string
          description: Код ошибки.
          enum:
            - SESSION_ENDED
            - INVALID_MESSAGE
        description:
          type: string
          minLength: 1
          description: Описание ошибки на английском языке.
