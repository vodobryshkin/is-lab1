plugins {
    id 'java'
    id 'war'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.4.20'
}

group = 'com.github.vodobryshkin.is-lab1'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    jakartaWebProfileVersion = '10.0.0'
    junitVersion = '5.14.4'
    assertJVersion = '3.27.7'
    lombokVersion = '1.18.48'
    hibernateValidatorVersion = '8.0.6.Final'
    expresslyVersion = '5.0.0'
    yassonVersion = '3.0.4'
    parssonVersion = '1.1.9'
    eclipseLinkVersion = '4.0.9'
    postgresqlVersion = '42.7.14'
    jakartaPersistenceVersion = '3.1.0'
    resteasyVersion = '6.2.14.Final'
}

configurations {
    postgresDriver {
        transitive = false
    }
    serverJacocoAgent {
        transitive = false
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

checkstyle {
    toolVersion = '14.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')

    ignoreFailures = false
    showViolations = true
}

pmd {
    consoleOutput = true
    toolVersion = '7.16.0'
    rulesMinimumPriority = 5

    ruleSetFiles = files('config/pmd/pmd.xml')
    ruleSets = []
}

// Покрытие объединяет JUnit (test.exec) и прогон Hurl на сервере с агентом (hurl.exec).
def coverageData = fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec')

jacocoTestReport {
    executionData.setFrom(coverageData)
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    executionData.setFrom(coverageData)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

tasks.withType(Pmd).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    compileOnly "jakarta.platform:jakarta.jakartaee-web-api:${jakartaWebProfileVersion}"

    implementation("org.eclipse.persistence:org.eclipse.persistence.jpa:${eclipseLinkVersion}") {
        exclude group: 'jakarta.persistence', module: 'jakarta.persistence-api'
    }
    postgresDriver "org.postgresql:postgresql:${postgresqlVersion}"
    serverJacocoAgent "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"

    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertJVersion}"
    testImplementation "jakarta.persistence:jakarta.persistence-api:${jakartaPersistenceVersion}"
    testImplementation "org.jboss.resteasy:resteasy-core:${resteasyVersion}"
    testImplementation "org.hibernate.validator:hibernate-validator:${hibernateValidatorVersion}"
    testRuntimeOnly "org.glassfish.expressly:expressly:${expresslyVersion}"
    testImplementation "org.eclipse:yasson:${yassonVersion}"
    testImplementation "org.eclipse.parsson:parsson:${parssonVersion}"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

test {
    useJUnitPlatform {
        excludeTags 'server'
    }
}

tasks.register('serverTest', Test) {
    description = 'Проверяет WebSocket-события на запущенном сервере (IS_LAB1_BASE_URL).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'server'
    }
    outputs.upToDateWhen { false }
}

tasks.register('preparePostgresDriver', Copy) {
    description = 'Копирует JDBC-драйвер PostgreSQL для развёртывания на сервере.'
    from configurations.postgresDriver
    into layout.buildDirectory.dir('server')
    rename { 'postgresql.jar' }
}

tasks.register('prepareJacocoAgent', Copy) {
    description = 'Копирует JaCoCo-агент для запуска сервера при прогоне Hurl.'
    from configurations.serverJacocoAgent
    into layout.buildDirectory.dir('server')
    rename { 'jacocoagent.jar' }
}
