                    description: URI-reference, идентифицирующий тип проблемы.
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 401
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                description: Описание ошибки в формате RFC 9457.
              examples:
                example0:
                  value:
                    type: /problems/invalid-token
                    title: Invalid token
                    status: 401
                    detail: The bearer token is invalid or expired.
                example1:
                  value:
                    type: /problems/missing-token
                    title: Authentication required
                    status: 401
                    detail: A bearer token is required.
        '404':
          description: Адрес не найден.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 404
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                  type:
                    type: string
                    enum:
                      - /problems/address-not-found
                required:
                  - title
                  - status
                  - type
              example:
                type: /problems/address-not-found
                title: Address not found
                status: 404
                detail: Address with id=999 does not exist.
      tags:
        - Addresses
    put:
      operationId: Addresses_updateAddress
      summary: Обновить адрес.
      description: Заменяет поля адреса и привязку локации в одной транзакции.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Запрос успешно выполнен, ответ без тела.
        '400':
          description: Ошибка валидации запроса.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      title:
                        type: string
                        description: Краткое название типа проблемы.
                      status:
                        type: number
                        enum:
                          - 400
                        description: HTTP-статус, совпадающий со статусом ответа.
                      detail:
