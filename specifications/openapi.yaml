openapi: 3.1.0
info:
  title: Workers API
  version: 0.1.0
externalDocs:
  url: https://github.com/vodobryshkin/is-lab1/blob/main/api-contract/events/asyncapi.yaml
  description: 'WebSocket: сообщения, ошибки и примеры (AsyncAPI).'
tags:
  - name: Auth
  - name: Workers
  - name: Organizations
  - name: Addresses
  - name: Locations
  - name: Coordinates
  - name: Persons
paths:
  /addresses:
    post:
      operationId: Addresses_createAddress
      summary: Создать адрес.
      description: Создаёт адрес и привязывает новую или существующую локацию.
      parameters: []
      responses:
        '201':
          description: Ресурс успешно создан
          headers:
            Location:
              required: false
              description: URI созданного ресурса.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok.IdResponse'
              examples:
                example0:
                  value:
                    id: 42
                example1:
                  value:
                    id: 42
                example2:
                  value:
                    id: 42
        '400':
          description: 'Ошибка: запрос невозможно обработать.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                    description: URI-reference, идентифицирующий тип проблемы.
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 400
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                description: Описание ошибки в формате RFC 9457.
              example:
                type: /problems/malformed-json
                title: Malformed JSON
                status: 400
                detail: The request body contains invalid JSON.
        '401':
          description: 'Ошибка: отсутствуют действительные данные аутентификации.'
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                    description: URI-reference, идентифицирующий тип проблемы.
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 401
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                description: Описание ошибки в формате RFC 9457.
              examples:
                example0:
                  value:
                    type: /problems/invalid-token
                    title: Invalid token
                    status: 401
                    detail: The bearer token is invalid or expired.
                example1:
                  value:
                    type: /problems/missing-token
                    title: Authentication required
                    status: 401
                    detail: A bearer token is required.
        '403':
          description: 'Ошибка: сервер отказывается выполнять запрос из-за недостатка прав.'
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                    description: URI-reference, идентифицирующий тип проблемы.
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 403
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                description: Описание ошибки в формате RFC 9457.
              example:
                type: /problems/insufficient-permissions
                title: Insufficient permissions
                status: 403
                detail: Modifying addresses is not allowed.
        '404':
          description: 'Ошибка: ресурс не найден либо его существование скрыто.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.LocationNotFoundDetails'
              example:
                type: /problems/location-not-found
                title: Location not found
                status: 404
                detail: Location with id=999 does not exist.
                location_id: 999
        '422':
          description: Ошибка валидации адреса.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 422
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                  type:
                    type: string
                    enum:
                      - /problems/validation-failed
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Addresses.Errors.AddressRequestValidationIssue'
                    minItems: 1
                    description: Ошибки полей.
                required:
                  - title
                  - status
                  - type
                  - errors
              example:
                type: /problems/validation-failed
                title: Validation failed
                status: 422
                errors:
                  - field: street
                    title: MUST_NOT_BE_EMPTY
                    description: Street must not be empty.
                  - field: town.x
                    title: OUT_OF_RANGE
                    description: Town x must be within the int32 range.
      tags:
        - Addresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Domain.AddressFields'
            examples:
              example0:
                value:
                  street: Ул. Пушкина
                  town: null
              example1:
                value:
                  street: Ул. Пушкина
                  town:
                    x: 10
                    'y': 10
                    z: 10
              example2:
                value:
                  street: Ул. Пушкина
                  town:
                    id: 7
    get:
      operationId: Addresses_listAddresses
      summary: Получить список адресов.
      description: Возвращает страницу адресов. Фильтры соединяются через AND; null не проходит непустой фильтр.
      parameters:
        - $ref: '#/components/parameters/Domain.ListParameters.page'
        - $ref: '#/components/parameters/Domain.ListParameters.page_size'
        - $ref: '#/components/parameters/Domain.ListParameters.sort_order'
        - name: sort_by
          in: query
          required: false
          description: Поле сортировки. Строки сравниваются без учёта регистра.
          schema:
            type: string
            enum:
              - id
              - street
            default: id
          explode: false
        - name: street
          in: query
          required: false
          description: Название улицы.
          schema:
            $ref: '#/components/schemas/Domain.SubstringFilter'
          explode: false
      responses:
        '200':
          description: Запрос успешно выполнен.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - page_size
                  - total_items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Addresses.GetSingleAddressResponse'
                    description: Объекты страницы.
                  page:
                    type: integer
                    format: int32
                    description: Номер страницы, начиная с 1.
                    exclusiveMinimum: 0
                  page_size:
                    type: integer
                    format: int32
                    maximum: 100
                    description: Размер страницы.
                    exclusiveMinimum: 0
                  total_items:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Количество объектов с учётом фильтров.
                description: Страница объектов.
                examples:
                  - items: []
                    page: 1
                    page_size: 20
                    total_items: 0
              examples:
                example0:
                  value:
                    items:
                      - street: Ул. Пушкина
                        town:
                          x: 10
                          'y': 10
                          z: 10
                          id: 7
                        id: 42
                    page: 1
                    page_size: 20
                    total_items: 1
                example1:
                  value:
                    items: []
                    page: 2
                    page_size: 20
                    total_items: 1
                example2:
                  value:
                    items: []
                    page: 1
                    page_size: 20
                    total_items: 0
                example3:
                  value:
                    items:
                      - street: Ул. Пушкина
                        town:
                          x: 10
                          'y': 10
                          z: 10
                          id: 7
                        id: 42
                    page: 1
                    page_size: 20
                    total_items: 1
        '400':
          description: Ошибка валидации запроса.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 400
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                  type:
                    type: string
                    enum:
                      - /problems/validation-failed
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Errors.ParameterValidationIssue'
                    minItems: 1
                    description: Ошибки полей.
                required:
                  - title
                  - status
                  - type
                  - errors
              example:
                type: /problems/validation-failed
                title: Invalid request parameters
                status: 400
                errors:
                  - field: page
                    title: MUST_BE_POSITIVE
                    description: Page must be greater than zero.
                  - field: page_size
                    title: OUT_OF_RANGE
                    description: Page size must not exceed 100.
                  - field: sort_by
                    title: INVALID_ENUM_VALUE
                    description: The sort field is not supported.
                  - field: sort_order
                    title: INVALID_ENUM_VALUE
                    description: Sort order must be asc or desc.
        '401':
          description: 'Ошибка: отсутствуют действительные данные аутентификации.'
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                    description: URI-reference, идентифицирующий тип проблемы.
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
                    enum:
                      - 401
                    description: HTTP-статус, совпадающий со статусом ответа.
                  detail:
                    type: string
                    description: Подробности конкретного случая ошибки.
                  instance:
                    type: string
                    description: URI-reference, идентифицирующий конкретный случай ошибки.
                description: Описание ошибки в формате RFC 9457.
              examples:
                example0:
                  value:
                    type: /problems/invalid-token
                    title: Invalid token
                    status: 401
                    detail: The bearer token is invalid or expired.
                    instance: /problem-occurrences/example-401
                example1:
                  value:
                    type: /problems/missing-token
                    title: Authentication required
                    status: 401
                    detail: A bearer token is required.
      tags:
        - Addresses
  /addresses/{id}:
    get:
      operationId: Addresses_getAddress
      summary: Получить адрес.
      description: Возвращает адрес и вложенную локацию.
