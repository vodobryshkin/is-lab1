          description: Запрос успешно выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addresses.GetSingleAddressResponse'
              examples:
                example0:
                  value:
                    street: Ул. Пушкина
                    town: null
                    id: 42
                example1:
                  value:
                    street: Ул. Пушкина
                    town:
                      x: 10
                      'y': 10
                      z: 10
                      id: 7
                    id: 42
        '400':
          description: Ошибка валидации запроса.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: Краткое название типа проблемы.
                  status:
                    type: number
