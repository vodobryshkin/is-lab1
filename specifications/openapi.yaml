                  - errors
              example:
                type: /problems/validation-failed
                title: Invalid request parameters
                status: 400
                errors:
                  - field: id
                    title: MUST_BE_POSITIVE
                    description: Address ID must be greater than zero.
        '401':
          description: 'Ошибка: отсутствуют действительные данные аутентификации.'
          headers:
            WWW-Authenticate:
              required: true
              schema:
