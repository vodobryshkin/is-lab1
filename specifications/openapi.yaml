          type: integer
          format: int64
          minimum: 1
          description: ID организации.
        official_address_id:
          type: integer
          format: int64
          minimum: 1
          description: ID официального адреса.
        postal_address_id:
          type: integer
          format: int64
          minimum: 1
          description: ID почтового адреса.
